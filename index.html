<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <div class="calculator">

        <input id="display2"  disabled>
        <input id="display" disabled>
        <div class="keys">
            <button class="btn-operator" onclick="Clear()">C</button>
            <button class="btn-operator" id="btn-del" onclick="deleteValue()">DEL</button>
            <button class="btn-operator" onclick="addToDisplay('%')">%</button>
            <button  class="btn-operator"  onclick="addToDisplay('+')">+</button>
            <button  onclick="addToDisplay('7')">7</button>
            <button  onclick="addToDisplay('8')">8</button>
            <button  onclick="addToDisplay('9')">9</button>
            <button  class="btn-operator" onclick="addToDisplay('-')">-</button>
            <button  onclick="addToDisplay('4')">4</button>
              <button  onclick="addToDisplay('5')">5</button>
              <button  onclick="addToDisplay('6')">6</button>
              <button  class="btn-operator" onclick="addToDisplay('*')">X</button>
              <button  onclick="addToDisplay('1')">1</button>
              <button onclick="addToDisplay('2')">2</button>
              <button onclick="addToDisplay('3')">3</button>
              <button class="btn-operator" id="btn-equal" onclick="calculate()">=</button>
              <button onclick="addToDisplay('0')">0</button>
              <button  onclick="addToDisplay('.')" >.</button>
              <button  onclick="addToDisplay('/')">/</button>
            </div>
                 
        
    </div>

    <script src="./app.js"></script>
</body>
</html>
